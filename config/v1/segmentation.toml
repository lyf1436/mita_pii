# 3-class segmentation (background / face / plate) of PP4AV with MiTA-Segmenter.
# model id = <version>_<dataset_nickname>_<task_nickname>_<model_name>_<job_name>
#          = v1_pp4av_seg3_mita_segmentation_vit_tiny
#   weights: model_weights/<model id>     logs: training_logs/<model id>
#
#   python -m trainer.segmentation_acc --config config/v1/segmentation.toml                 # train
#   python -m trainer.segmentation_opt --config config/v1/segmentation.toml                 # tune, then
#   python -m trainer.segmentation_acc --config config/v1/segmentation.toml --best_params   # train with the best trial

version = "v1"
dataset_paths = ["data/v1/pp4av_segmentation_train"]   # merged into one training set; relative to the repository
dataset_nickname = "pp4av"
task_nickname = "seg3"
model_name = "mita_segmentation"                       # the model this task trains
job_name = "vit_tiny"

[classification]
# model outputs, in the same order as the classes of the prepared segmentation data
classes = ["background", "face", "plate"]

[training]
# model: any non-distilled ViT that MiTA-Segmenter has a configuration for
backbone = "vit_tiny_patch16_384"
grid = 32                     # patches per side of every model input; MiTA attention only accepts 32 or 40
px_per_patch = 8              # original-image pixels per model patch; sets the upscale (2x for patch-16)
dropout = 0.0
drop_path_rate = 0.1

# data
valid_fraction = 0.1          # random share of the training images held out for validation ...
valid_subsets = []            # ... unless whole subsets are named here (avoids near-duplicate frames in both)
seed = 0
scale_jitter = [0.75, 1.25]   # random multiplier on the upscale during training
object_crop_prob = 0.5        # share of training crops placed around a random object
num_workers = 12

# optimisation: MiTA-Segmenter's own training recipe, as published for ADE20K
opt = "sgd"
lr = 0.001
momentum = 0.9
weight_decay = 0.0
sched = "polynomial"
poly_power = 0.9
poly_step_size = 1
min_lr = 1e-5
epochs = 64                   # planned length: sets the schedule and the log/eval spacing; may stop earlier
batch_size = 8                # per device
dice_weight = 1.0             # loss = CE + dice_weight * mean Dice over face and plate

# logging / evaluation: counts over the planned run, evenly spaced, so they land at the same share of
# training images for any batch size or device count (TensorBoard's x axis is training images seen)
num_logs = 1000               # TensorBoard training records
num_evals = 32                # full-image validation passes (the last one at the end of the run)
eval_batch_size = 16          # windows per forward pass during validation

# early stopping on the validation loss (CE + mean Dice loss, Dice weighted 1 so runs share one scale):
# stop when the loss fell by less than `min_decrease` per evaluation, averaged over the last `window` evaluations,
# i.e. (loss[now - window] - loss[now]) / window < early_stopping_min_decrease. window = 0 turns it off.
early_stopping_window = 4
early_stopping_min_decrease = 0.001

[optuna]
n_trials = 20                 # total across workers and re-runs of the study (parallel workers may overshoot by a few)
metric = "mean_dice"          # validation metric: mean_dice, mean_iou, dice_face, iou_plate, ...
direction = "maximize"
pruner = "median"             # "median" or "none"; compares trials at the same evaluation
# storage = "sqlite:///..."   # default: training_logs/<model id>/optuna.db

# [training] values used only while searching
[optuna.training_overrides]
early_stopping_min_decrease = 0.005   # stop unpromising settings sooner than the final run does

# each entry tunes the [training] key of the same name
[optuna.params]
lr = { type = "float", low = 3e-4, high = 1e-2, log = true }
dice_weight = { type = "float", low = 0.25, high = 4.0, log = true }
object_crop_prob = { type = "float", low = 0.25, high = 0.9 }
drop_path_rate = { type = "float", low = 0.0, high = 0.3 }

[accelerate]
num_devices = 1               # GPUs: training spreads one run over them; tuning runs one trial per GPU
mixed_precision = "bf16"      # MiTA attention runs fp16 internally; bf16 for the rest saves time and memory
